<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Tools Demo</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .demo-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }

        .tool-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            margin: 15px 0;
        }

        .tool-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tool-name {
            color: #4CAF50;
            font-size: 20px;
            font-weight: 600;
        }

        .tool-description {
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .tool-params {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .param-item {
            margin: 10px 0;
        }

        .param-label {
            color: #2196F3;
            font-weight: 500;
            display: block;
            margin-bottom: 5px;
        }

        .param-input {
            width: 100%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            color: white;
            font-family: 'Courier New', monospace;
        }

        .test-btn {
            background: rgba(76, 175, 80, 0.6);
            color: white;
            border: 1px solid rgba(76, 175, 80, 0.8);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .test-btn:hover {
            background: rgba(76, 175, 80, 0.8);
        }

        .result-box {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            color: white;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }

        .category-badge {
            background: rgba(33, 150, 243, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: 600;
        }

        .nav-links {
            margin-bottom: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin-right: 10px;
            display: inline-block;
        }

        .nav-links a:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="header">
            <h1>Model Tools Demo</h1>
            <p>Test the tools available to your AI models</p>
        </div>

        <div class="nav-links">
            <a href="index.html">← Back to Chat</a>
            <a href="#" id="loadToolsBtn">🔄 Reload Tools</a>
        </div>

        <div class="model-selector" style="margin-bottom: 30px;">
            <label style="color: white; margin-right: 10px;">Testing as Model:</label>
            <select id="modelSelect" style="padding: 8px; border-radius: 5px; background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.3);">
                <option value="1">Model 1 (Alpha)</option>
                <option value="2">Model 2 (Beta)</option>
            </select>
        </div>

        <div id="toolsContainer">
            <p style="color: white;">Loading tools...</p>
        </div>
    </div>

    <script>
        let tools = [];
        let categories = {};

        async function loadTools() {
            try {
                const response = await fetch('http://localhost:3000/tools');
                const data = await response.json();

                if (data.success) {
                    tools = data.tools;
                    categories = data.categories;
                    displayTools();
                } else {
                    console.error('Failed to load tools:', data.error);
                    document.getElementById('toolsContainer').innerHTML =
                        `<p style="color: #f44336;">Error loading tools: ${data.error}</p>`;
                }
            } catch (error) {
                console.error('Error fetching tools:', error);
                document.getElementById('toolsContainer').innerHTML =
                    `<p style="color: #f44336;">Error: ${error.message}. Make sure the server is running!</p>`;
            }
        }

        function displayTools() {
            const container = document.getElementById('toolsContainer');
            container.innerHTML = '';

            tools.forEach(tool => {
                const category = findCategory(tool.name);
                const card = createToolCard(tool, category);
                container.appendChild(card);
            });
        }

        function findCategory(toolName) {
            for (const [cat, toolNames] of Object.entries(categories)) {
                if (toolNames.includes(toolName)) {
                    return cat;
                }
            }
            return 'general';
        }

        function createToolCard(tool, category) {
            const card = document.createElement('div');
            card.className = 'tool-card';

            const params = tool.parameters?.properties || {};
            const required = tool.parameters?.required || [];

            let paramsHTML = '';
            for (const [paramName, paramDef] of Object.entries(params)) {
                const isRequired = required.includes(paramName);
                const paramId = `${tool.name}_${paramName}`;

                let inputType = 'text';
                let inputHTML = '';

                if (paramDef.enum) {
                    inputHTML = `<select class="param-input" id="${paramId}">
                        ${paramDef.enum.map(val => `<option value="${val}">${val}</option>`).join('')}
                    </select>`;
                } else if (paramDef.type === 'number') {
                    inputHTML = `<input type="number" class="param-input" id="${paramId}"
                        ${paramDef.minimum !== undefined ? `min="${paramDef.minimum}"` : ''}
                        ${paramDef.maximum !== undefined ? `max="${paramDef.maximum}"` : ''}>`;
                } else {
                    inputHTML = `<input type="text" class="param-input" id="${paramId}"
                        placeholder="${paramDef.description || ''}">`;
                }

                paramsHTML += `
                    <div class="param-item">
                        <label class="param-label">
                            ${paramName} ${isRequired ? '<span style="color: #f44336;">*</span>' : ''}
                        </label>
                        <div style="font-size: 12px; color: rgba(255,255,255,0.7); margin-bottom: 5px;">
                            ${paramDef.description || ''}
                        </div>
                        ${inputHTML}
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="tool-header">
                    <span class="tool-name">${tool.name}</span>
                    <span class="category-badge">${category}</span>
                </div>
                <div class="tool-description">${tool.description}</div>
                ${paramsHTML ? `
                    <div class="tool-params">
                        <strong style="color: white;">Parameters:</strong>
                        ${paramsHTML}
                    </div>
                ` : ''}
                <button class="test-btn" onclick="testTool('${tool.name}')">
                    🧪 Test Tool
                </button>
                <div id="result_${tool.name}" style="display: none;"></div>
            `;

            return card;
        }

        async function testTool(toolName) {
            const tool = tools.find(t => t.name === toolName);
            if (!tool) return;

            // Collect parameters
            const parameters = {};
            const params = tool.parameters?.properties || {};

            for (const paramName of Object.keys(params)) {
                const paramId = `${toolName}_${paramName}`;
                const input = document.getElementById(paramId);
                if (input && input.value) {
                    let value = input.value;
                    // Convert to number if needed
                    if (params[paramName].type === 'number') {
                        value = parseFloat(value);
                    }
                    parameters[paramName] = value;
                }
            }

            // Check required parameters
            const required = tool.parameters?.required || [];
            for (const req of required) {
                if (!parameters[req]) {
                    alert(`Required parameter missing: ${req}`);
                    return;
                }
            }

            const modelNum = parseInt(document.getElementById('modelSelect').value);
            const modelName = modelNum === 1 ? 'Alpha' : 'Beta';

            const resultDiv = document.getElementById(`result_${toolName}`);
            resultDiv.style.display = 'block';
            resultDiv.className = 'result-box';
            resultDiv.textContent = 'Executing...';

            try {
                const response = await fetch('http://localhost:3000/execute-tool', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        toolName,
                        parameters,
                        modelNum,
                        modelName
                    })
                });

                const result = await response.json();
                resultDiv.textContent = JSON.stringify(result, null, 2);

                if (result.success) {
                    resultDiv.style.borderLeft = '4px solid #4CAF50';
                } else {
                    resultDiv.style.borderLeft = '4px solid #f44336';
                }

            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}`;
                resultDiv.style.borderLeft = '4px solid #f44336';
            }
        }

        // Event listeners
        document.getElementById('loadToolsBtn').addEventListener('click', (e) => {
            e.preventDefault();
            loadTools();
        });

        // Load tools on page load
        loadTools();
    </script>
</body>
</html>
